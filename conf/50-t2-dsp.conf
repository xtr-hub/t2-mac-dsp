# T2 Mac 内置扬声器 DSP —— PipeWire 原生 filter-chain 配置
#
# 由 tools/gen-conf.py 从官方数据生成，机型 15_4
# 数据来源: Fedora t2linux-audio 包 /usr/share/t2linux-audio/15_4/graph.json
#          （T2 官方团队基于 Asahi Linux 的测量结果制作）
#
# 处理链: bankstown 虚拟低音 -> 响度补偿 -> 四路 FIR 卷积(前/后 x 左/右)
#         -> 分频压缩 -> 独立限幅
#
# 安装位置: ~/.config/pipewire/pipewire.conf.d/50-t2-dsp.conf
# 完全用户级，删除该文件即可回滚。
#
# 相对官方 graph.json 的改动:
#   1. FIR 路径 t2-linux-audio -> t2linux-audio（Fedora 打包 bug）
#   2. 移除 target.object（改由 session manager 自动连接）
#   3. 卷积器增益 0.92 -> 3.0（电平补偿）

context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "MacBook Pro 15,4 DSP Speakers"
        media.name = "MacBook Pro 15,4 DSP Speakers"
        filter.graph = {
            nodes = [
                {
                    type = "lv2"
                    plugin = "https://chadmed.au/bankstown"
                    name = "bassex"
                    control = {
                        bypass = 0
                        amt = 3.0
                        sat_second = 1.5
                        sat_third = 1.5
                        blend = 0.75
                        ceil = 150.0
                        floor = 40.0
                    }
                }
                {
                    type = "lv2"
                    plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                    name = "ell"
                    control = {
                        enabled = 1
                        input = 1.0
                        fft = 2
                    }
                }
                {
                    type = "lv2"
                    plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                    name = "elr"
                    control = {
                        enabled = 1
                        input = 1.0
                        fft = 2
                    }
                }
                {
                    type = "builtin"
                    label = "convolver"
                    name = "convFL"
                    config = {
                        filename = [
                            "/usr/share/t2linux-audio/15_4/front-44.wav"
                            "/usr/share/t2linux-audio/15_4/front-48.wav"
                            "/usr/share/t2linux-audio/15_4/front-96.wav"
                            "/usr/share/t2linux-audio/15_4/front-192.wav"
                        ]
                        channel = 0
                        gain = 4.0
                    }
                }
                {
                    type = "builtin"
                    label = "convolver"
                    name = "convFR"
                    config = {
                        filename = [
                            "/usr/share/t2linux-audio/15_4/front-44.wav"
                            "/usr/share/t2linux-audio/15_4/front-48.wav"
                            "/usr/share/t2linux-audio/15_4/front-96.wav"
                            "/usr/share/t2linux-audio/15_4/front-192.wav"
                        ]
                        channel = 0
                        gain = 4.0
                    }
                }
                {
                    type = "builtin"
                    label = "convolver"
                    name = "convRL"
                    config = {
                        filename = [
                            "/usr/share/t2linux-audio/15_4/rear-44.wav"
                            "/usr/share/t2linux-audio/15_4/rear-48.wav"
                            "/usr/share/t2linux-audio/15_4/rear-96.wav"
                            "/usr/share/t2linux-audio/15_4/rear-192.wav"
                        ]
                        channel = 0
                        gain = 4.0
                    }
                }
                {
                    type = "builtin"
                    label = "convolver"
                    name = "convRR"
                    config = {
                        filename = [
                            "/usr/share/t2linux-audio/15_4/rear-44.wav"
                            "/usr/share/t2linux-audio/15_4/rear-48.wav"
                            "/usr/share/t2linux-audio/15_4/rear-96.wav"
                            "/usr/share/t2linux-audio/15_4/rear-192.wav"
                        ]
                        channel = 0
                        gain = 4.0
                    }
                }
                {
                    type = "lv2"
                    plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                    name = "fwoofer_bp"
                    control = {
                        mode = 0
                        ce_0 = 1
                        sla_0 = 5.0
                        cr_0 = 1.75
                        al_0 = 0.625
                        at_0 = 1.0
                        rt_0 = 100
                        kn_0 = 0.125
                        cbe_1 = 1
                        sf_1 = 250.0
                        ce_1 = 0
                        cbe_2 = 0
                        ce_2 = 0
                        cbe_3 = 0
                        ce_3 = 0
                        cbe_4 = 0
                        ce_4 = 0
                        cbe_5 = 0
                        ce_5 = 0
                        cbe_6 = 0
                        ce_6 = 0
                    }
                }
                {
                    type = "lv2"
                    plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                    name = "fwoofer_lim"
                    control = {
                        sla = 5.0
                        al = 1.0
                        at = 1.0
                        rt = 100.0
                        cr = 15.0
                        kn = 0.5
                    }
                }
                {
                    type = "lv2"
                    plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                    name = "rwoofer_bp"
                    control = {
                        mode = 0
                        ce_0 = 1
                        sla_0 = 5.0
                        cr_0 = 1.75
                        al_0 = 0.625
                        at_0 = 1.0
                        rt_0 = 100
                        kn_0 = 0.125
                        cbe_1 = 1
                        sf_1 = 250.0
                        ce_1 = 0
                        cbe_2 = 0
                        ce_2 = 0
                        cbe_3 = 0
                        ce_3 = 0
                        cbe_4 = 0
                        ce_4 = 0
                        cbe_5 = 0
                        ce_5 = 0
                        cbe_6 = 0
                        ce_6 = 0
                    }
                }
                {
                    type = "lv2"
                    plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                    name = "rwoofer_lim"
                    control = {
                        sla = 5.0
                        al = 1.0
                        at = 1.0
                        rt = 100.0
                        cr = 15.0
                        kn = 0.5
                    }
                }
            ]
            links = [
                {
                    output = "bassex:out_l"
                    input = "ell:in"
                }
                {
                    output = "bassex:out_r"
                    input = "elr:in"
                }
                {
                    output = "ell:out"
                    input = "convFL:In"
                }
                {
                    output = "elr:out"
                    input = "convFR:In"
                }
                {
                    output = "ell:out"
                    input = "convRL:In"
                }
                {
                    output = "elr:out"
                    input = "convRR:In"
                }
                {
                    output = "convFL:Out"
                    input = "fwoofer_bp:in_l"
                }
                {
                    output = "convFR:Out"
                    input = "fwoofer_bp:in_r"
                }
                {
                    output = "convRL:Out"
                    input = "rwoofer_bp:in_l"
                }
                {
                    output = "convRR:Out"
                    input = "rwoofer_bp:in_r"
                }
                {
                    output = "fwoofer_bp:out_l"
                    input = "fwoofer_lim:in_l"
                }
                {
                    output = "fwoofer_bp:out_r"
                    input = "fwoofer_lim:in_r"
                }
                {
                    output = "rwoofer_bp:out_l"
                    input = "rwoofer_lim:in_l"
                }
                {
                    output = "rwoofer_bp:out_r"
                    input = "rwoofer_lim:in_r"
                }
            ]
            inputs = [
                "bassex:in_l"
                "bassex:in_r"
            ]
            outputs = [
                "fwoofer_lim:out_l"
                "fwoofer_lim:out_r"
                "rwoofer_lim:out_l"
                "rwoofer_lim:out_r"
            ]
            capture.volumes = [
                {
                    control = "ell:volume"
                    min = -36.0
                    max = 0.0
                    scale = "linear"
                }
                {
                    control = "elr:volume"
                    min = -36.0
                    max = 0.0
                    scale = "linear"
                }
            ]
        }
        capture.props = {
            node.name = "audio_effect.t2-154-speakers"
            media.class = "Audio/Sink"
            audio.channels = "2"
            audio.position = [
                "FL"
                "FR"
            ]
            audio.allowed-rates = [ 96000 88200 48000 44100 ]
            device.api = "dsp"
            node.virtual = "false"
            priority.session = 1500
            state.default-volume = 1.0
            device.icon-name = "audio-speakers"
        }
        playback.props = {
            node.name = "effect_output.t2-154-speakers"
            node.description = "MacBook Pro 15,4 DSP Speakers Out"
            media.name = "MacBook Pro 15,4 DSP Speakers Out"
            node.passive = "true"
            audio.channels = "4"
            audio.allowed-rates = [ 96000 88200 48000 44100 ]
            audio.position = [
                "AUX0"
                "AUX1"
                "AUX2"
                "AUX3"
            ]
        }
    }
}
]
